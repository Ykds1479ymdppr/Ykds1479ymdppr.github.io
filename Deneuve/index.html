<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <a href="../">Home</a>
  <title>Google Search</title>
  <link rel="preconnect" href="https://potentialproxy.josephine25252525.workers.dev">
  <link rel="dns-prefetch" href="https://potentialproxy.josephine25252525.workers.dev">
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    :root{
      --bg:#0d0d0f;--bg2:#161618;--bg3:#1e1e22;--bg4:#2a2a30;
      --border:#333338;--accent:#5b8def;--accent-h:#4a7de0;
      --text:#e8e8ec;--text-dim:#888;--text-mute:#666;
      --radius:8px;--radius-sm:6px;
    }
    body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;display:flex;flex-direction:column;height:100vh;overflow:hidden;}
    #bar{display:flex;flex-direction:column;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0;z-index:99999;}
    .nav-row{display:flex;gap:6px;padding:8px 10px;align-items:center;}
    .nav-btn{width:32px;height:32px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--bg3);color:var(--text-dim);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0;}
    .nav-btn:hover{background:var(--bg4);color:var(--text);border-color:var(--accent);}
    .nav-btn:disabled{opacity:.35;cursor:default;}
    .nav-btn:disabled:hover{background:var(--bg3);color:var(--text-dim);border-color:var(--border);}
    #url{flex:1;padding:8px 14px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--bg3);color:var(--text);font-size:14px;outline:none;transition:border-color .15s;}
    #url:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(91,141,239,.15);}
    #go{padding:8px 18px;border-radius:var(--radius-sm);border:none;background:var(--accent);color:#fff;font-size:14px;font-weight:500;cursor:pointer;transition:background .15s;flex-shrink:0;}
    #go:hover{background:var(--accent-h);}
    .tabs-row{display:flex;gap:3px;padding:0 8px 6px 8px;overflow-x:auto;align-items:center;scrollbar-width:thin;scrollbar-color:var(--bg4) transparent;}
    .tabs-row::-webkit-scrollbar{height:3px;}
    .tabs-row::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:3px;}
    .tab{display:flex;align-items:center;gap:6px;padding:5px 10px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);font-size:12px;color:var(--text-dim);cursor:pointer;user-select:none;max-width:180px;min-width:60px;transition:all .15s;flex-shrink:0;}
    .tab:hover{background:var(--bg4);}
    .tab.active{background:var(--accent);color:#fff;border-color:var(--accent);}
    .tab-title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;}
    .tab-close{font-weight:bold;cursor:pointer;opacity:.4;font-size:14px;width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s;}
    .tab-close:hover{opacity:1;background:rgba(0,0,0,.25);}
    #add-tab{padding:4px 12px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text-dim);cursor:pointer;font-size:16px;line-height:1;flex-shrink:0;transition:all .15s;}
    #add-tab:hover{background:var(--bg4);color:var(--text);}
    .tab-loading-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex-shrink:0;animation:pulse 1s infinite;display:none;}
    .tab.loading .tab-loading-dot{display:block;}
    @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
    #frames-container{flex:1;position:relative;background:var(--bg);}
    .proxy-frame{position:absolute;top:0;left:0;width:100%;height:100%;border:none;display:none;}
    .proxy-frame.active{display:block;}
    #loading-bar{position:absolute;top:0;left:0;right:0;height:2px;background:var(--accent);transform:scaleX(0);transform-origin:left;transition:transform .3s,opacity .3s;z-index:100000;opacity:0;}
    #loading-bar.loading{transform:scaleX(0.85);opacity:1;}
    #fs-btn{margin-left:auto;}
    #fs-btn svg{width:16px;height:16px;fill:currentColor;}
  </style>
</head>
<body>
  <div id="loading-bar"></div>
  <div id="bar">
    <div class="nav-row">
      <button class="nav-btn" id="back-btn" onclick="goBack()" title="Back">&#8592;</button>
      <button class="nav-btn" id="fwd-btn" onclick="goForward()" title="Forward">&#8594;</button>
      <button class="nav-btn" id="reload-btn" onclick="reloadTab()" title="Reload">&#8635;</button>
      <input id="url" type="text" placeholder="Search or enter a URL"/>
      <button id="go" onclick="go()">Go</button>
      <button class="nav-btn" id="fs-btn" onclick="toggleFullscreen()" title="Fullscreen">
        <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
      </button>
    </div>
    <div class="tabs-row" id="tabs-strip">
      <button id="add-tab" onclick="createNewTab()">+</button>
    </div>
  </div>
  <div id="frames-container"></div>
  <script>
    var PROXY_SELF = 'https://potentialproxy.josephine25252525.workers.dev';
    var PROXY_BASE = PROXY_SELF + '/?url=';
    function proxyUrl(target) { return PROXY_BASE + encodeURIComponent(target); }
    if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js').catch(function(){}); }
    var input = document.getElementById('url');
    var tabsStrip = document.getElementById('tabs-strip');
    var addTabBtn = document.getElementById('add-tab');
    var framesContainer = document.getElementById('frames-container');
    var loadingBar = document.getElementById('loading-bar');
    var backBtn = document.getElementById('back-btn');
    var fwdBtn = document.getElementById('fwd-btn');
    var reloadBtn = document.getElementById('reload-btn');
    var fsBtn = document.getElementById('fs-btn');
    var tabs = [];
    var activeTabId = null;
    var tabCounter = 0;
    input.addEventListener('keydown', function(e) { if(e.key==='Enter') go(); });
    function toggleFullscreen() {
      if (!document.fullscreenElement) { document.documentElement.requestFullscreen().catch(function(){}); }
      else { document.exitFullscreen(); }
    }
    document.addEventListener('fullscreenchange', function() {
      if (document.fullscreenElement) {
        fsBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/></svg>';
        fsBtn.title = 'Exit Fullscreen';
      } else {
        fsBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>';
        fsBtn.title = 'Fullscreen';
      }
    });
    class ProxyTab {
      constructor(id, title) {
        this.id = id; this.title = title || 'New Tab';
        this.currentRawUrl = ''; this.history = []; this.historyIndex = -1;
        this.isLoading = false; this.loaded = false;
        this.iframe = document.createElement('iframe');
        this.iframe.className = 'proxy-frame'; this.iframe.id = 'frame-' + id;
        this.iframe.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-forms allow-popups allow-modals allow-downloads allow-pointer-lock allow-top-navigation-by-user-activation allow-presentation');
        this.iframe.setAttribute('allow', 'autoplay; fullscreen; gamepad; camera; microphone; xr-spatial-tracking');
        framesContainer.appendChild(this.iframe);
        this.iframe.addEventListener('load', function() {
          this.isLoading = false; this.loaded = true;
          updateLoadingBar(); updateNavButtons(); updateTabLoadingState(this.id, false);
        }.bind(this));
      }
      navigate(target, addToHistory) {
        if (addToHistory === undefined) addToHistory = true;
        this.currentRawUrl = target;
        if (addToHistory) {
          this.history = this.history.slice(0, this.historyIndex + 1);
          this.history.push(target); this.historyIndex = this.history.length - 1;
        }
        this.isLoading = true; this.loaded = false;
        updateLoadingBar(); updateTabLoadingState(this.id, true);
        this.iframe.src = proxyUrl(target); updateNavButtons();
      }
    }
    function updateTabLoadingState(tabId, loading) {
      var tabEl = document.querySelector('.tab[data-tab-id="' + tabId + '"]');
      if (tabEl) { if (loading) tabEl.classList.add('loading'); else tabEl.classList.remove('loading'); }
    }
    function updateLoadingBar() {
      var anyLoading = tabs.some(function(t) { return t.isLoading; });
      if (anyLoading) loadingBar.classList.add('loading'); else loadingBar.classList.remove('loading');
    }
    function updateNavButtons() {
      var tab = getActiveTab();
      if (!tab) { backBtn.disabled = true; fwdBtn.disabled = true; return; }
      backBtn.disabled = tab.historyIndex <= 0;
      fwdBtn.disabled = tab.historyIndex >= tab.history.length - 1;
    }
    function getActiveTab() { return tabs.find(function(t) { return t.id === activeTabId; }); }
    function createNewTab(initialUrl) {
      var tabId = 'tab_' + (++tabCounter);
      var newTab = new ProxyTab(tabId);
      tabs.push(newTab); renderTabs(); switchActiveTab(tabId);
      if (initialUrl) { input.value = initialUrl; go(); }
      else { input.value = ''; input.focus(); }
      syncTabsToMemory();
    }
    function renderTabs() {
      var oldTabs = tabsStrip.querySelectorAll('.tab');
      oldTabs.forEach(function(node) { node.remove(); });
      tabs.forEach(function(tab) {
        var tabEl = document.createElement('div');
        tabEl.className = 'tab ' + (tab.id === activeTabId ? 'active' : '');
        tabEl.setAttribute('data-tab-id', tab.id);
        tabEl.addEventListener('click', function(e) {
          if (e.target.classList.contains('tab-close')) return;
          switchActiveTab(tab.id);
        });
        var loadingDot = document.createElement('span');
        loadingDot.className = 'tab-loading-dot';
        tabEl.appendChild(loadingDot);
        var titleEl = document.createElement('span');
        titleEl.className = 'tab-title'; titleEl.textContent = tab.title;
        tabEl.appendChild(titleEl);
        var closeEl = document.createElement('span');
        closeEl.className = 'tab-close'; closeEl.innerHTML = '&times;';
        closeEl.addEventListener('click', function() { closeTab(tab.id); });
        tabEl.appendChild(closeEl);
        tabsStrip.insertBefore(tabEl, addTabBtn);
      });
    }
    function switchActiveTab(tabId) {
      activeTabId = tabId;
      var currentTab = tabs.find(function(t) { return t.id === tabId; });
      document.querySelectorAll('.proxy-frame').forEach(function(f) { f.classList.remove('active'); });
      document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
      if (currentTab) { currentTab.iframe.classList.add('active'); input.value = currentTab.currentRawUrl; }
      renderTabs(); updateNavButtons();
    }
    function closeTab(tabId) {
      var tabIndex = tabs.findIndex(function(t) { return t.id === tabId; });
      if (tabIndex === -1) return;
      tabs[tabIndex].iframe.remove(); tabs.splice(tabIndex, 1);
      if (activeTabId === tabId) {
        if (tabs.length > 0) { switchActiveTab(tabs[Math.min(tabIndex, tabs.length - 1)].id); }
        else { activeTabId = null; input.value = ''; createNewTab(); }
      } else { renderTabs(); }
      syncTabsToMemory();
    }
    function goBack() {
      var tab = getActiveTab();
      if (!tab || tab.historyIndex <= 0) return;
      tab.historyIndex--;
      var target = tab.history[tab.historyIndex];
      tab.currentRawUrl = target; input.value = target;
      tab.isLoading = true; updateLoadingBar(); updateTabLoadingState(tab.id, true);
      tab.iframe.src = proxyUrl(target); updateNavButtons(); syncTabsToMemory();
    }
    function goForward() {
      var tab = getActiveTab();
      if (!tab || tab.historyIndex >= tab.history.length - 1) return;
      tab.historyIndex++;
      var target = tab.history[tab.historyIndex];
      tab.currentRawUrl = target; input.value = target;
      tab.isLoading = true; updateLoadingBar(); updateTabLoadingState(tab.id, true);
      tab.iframe.src = proxyUrl(target); updateNavButtons(); syncTabsToMemory();
    }
    function reloadTab() {
      var tab = getActiveTab();
      if (!tab) return;
      tab.isLoading = true; updateLoadingBar(); updateTabLoadingState(tab.id, true);
      tab.iframe.src = proxyUrl(tab.currentRawUrl);
    }
    function looksLikeUrl(s) {
      if(/^https?:\/\//i.test(s)) return true;
      return !s.includes(' ') && /^[^\s]+\.[a-z]{2,}(\/.*)?$/i.test(s);
    }
    function go() {
      var raw = input.value.trim();
      if(!raw || !activeTabId) return;
      var currentTab = tabs.find(function(t) { return t.id === activeTabId; });
      if (!currentTab) return;
      var target;
      if(looksLikeUrl(raw)){
        target = /^https?:\/\//i.test(raw) ? raw : 'https://' + raw;
        try { currentTab.title = new URL(target).hostname; } catch(e) { currentTab.title = raw; }
      } else {
        target = 'https://www.google.com/search?q=' + encodeURIComponent(raw);
        currentTab.title = 'Search: ' + raw;
      }
      currentTab.navigate(target, true);
      input.value = target;
      renderTabs(); syncTabsToMemory();
    }
    function syncTabsToMemory() {
      var dataState = tabs.map(function(t) { return { url: t.currentRawUrl, title: t.title }; });
      localStorage.setItem('deneuve_tabs_cache', JSON.stringify(dataState));
    }
    window.addEventListener('message', function(e) {
      var data = e.data;
      if (!data || typeof data !== 'object') return;
      if (data.type === 'DENEUVE_NEW_TAB' && data.url) { createNewTab(data.url); }
      else if (data.type === 'DENEUVE_GO' && data.url) { input.value = data.url; go(); }
      else if (data.type === 'DENEUVE_URL_UPDATE' && data.url) {
        var tab = getActiveTab();
        if (tab) {
          tab.currentRawUrl = data.url; input.value = data.url;
          try { tab.title = new URL(data.url).hostname; } catch(err) { tab.title = data.url; }
          renderTabs(); syncTabsToMemory();
        }
      }
    });
    window.addEventListener('DOMContentLoaded', function() {
      var cached = localStorage.getItem('deneuve_tabs_cache');
      if (cached) {
        try {
          var parse = JSON.parse(cached);
          if (parse && parse.length > 0) {
            parse.forEach(function(item, index) {
              var tabId = 'tab_' + (++tabCounter);
              var newTab = new ProxyTab(tabId, item.title);
              newTab.currentRawUrl = item.url;
              tabs.push(newTab);
            });
            renderTabs();
            switchActiveTab(tabs[0].id);
            if (tabs[0].currentRawUrl) { tabs[0].navigate(tabs[0].currentRawUrl, false); }
            setTimeout(function() {
              tabs.slice(1).forEach(function(tab) {
                if (tab.currentRawUrl) { tab.iframe.src = proxyUrl(tab.currentRawUrl); }
              });
            }, 2000);
            return;
          }
        } catch(e) {}
      }
      createNewTab();
    });
    document.addEventListener('keydown', function(e) {
      if(e.ctrlKey || e.metaKey) {
        if(e.key === 't') { e.preventDefault(); createNewTab(); }
        else if(e.key === 'w') { e.preventDefault(); if(activeTabId) closeTab(activeTabId); }
        else if(e.key === 'r') { e.preventDefault(); reloadTab(); }
        else if(e.key === 'l') { e.preventDefault(); input.focus(); input.select(); }
      }
    });
  </script>
</body>
</html>
